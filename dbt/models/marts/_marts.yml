version: 2
models:
  - name: dim_date
    columns:
      - name: date_key
        tests: [unique, not_null]
  - name: dim_customer
    columns:
      - name: customer_id
        tests: [unique, not_null]
  - name: dim_product
    columns:
      - name: product_id
        tests: [unique, not_null]
      - name: assumed_margin_pct
        tests: [not_null]
  - name: dim_seller
    columns:
      - name: seller_id
        tests: [unique, not_null]
  - name: fct_order_items
    description: One row per item sold. Revenue is item price (freight excluded); profit is estimated.
    tests:
      - dbt_utils_unique_combination: {columns: [order_id, order_item_id]}
    columns:
      - name: date_key
        tests:
          - relationships: {to: ref('dim_date'), field: date_key}
      - name: product_id
        tests:
          - relationships: {to: ref('dim_product'), field: product_id}
      - name: seller_id
        tests:
          - relationships: {to: ref('dim_seller'), field: seller_id}
  - name: fct_orders
    description: One row per order with delivery and review outcome.
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: date_key
        tests:
          - relationships: {to: ref('dim_date'), field: date_key}
