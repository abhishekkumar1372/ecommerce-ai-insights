version: 2
models:
  - name: stg_orders
    description: One row per order, typed.
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - not_null
          - relationships: {to: ref('stg_customers'), field: customer_id}
      - name: order_status
        tests:
          - accepted_values:
              values: [delivered, shipped, canceled, unavailable, invoiced, processing, created, approved]
  - name: stg_order_items
    description: One row per item in an order.
    tests:
      - dbt_utils_unique_combination: {columns: [order_id, order_item_id]}
    columns:
      - name: order_id
        tests:
          - relationships: {to: ref('stg_orders'), field: order_id}
      - name: product_id
        tests:
          - relationships: {to: ref('stg_products'), field: product_id}
      - name: price
        tests: [not_null, non_negative]
      - name: freight_value
        tests: [not_null, non_negative]
  - name: stg_payments
    columns:
      - name: order_id
        tests: [not_null]
      - name: payment_value
        tests: [non_negative]
  - name: stg_reviews
    description: One review per order after removing duplicates.
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: review_score
        tests:
          - accepted_values: {values: [1, 2, 3, 4, 5], quote: false}
  - name: stg_customers
    columns:
      - name: customer_id
        tests: [unique, not_null]
  - name: stg_sellers
    columns:
      - name: seller_id
        tests: [unique, not_null]
  - name: stg_products
    columns:
      - name: product_id
        tests: [unique, not_null]
      - name: category
        tests: [not_null]
  - name: stg_geolocation
    columns:
      - name: zip_prefix
        tests: [unique, not_null]
