name: ecommerce
version: "1.0.0"
profile: ecommerce

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

# The AI text-to-SQL service connects as ai_readonly: it may read marts and kpi, nothing else.
on-run-end:
  - "{{ grant_ai_readonly(['marts', 'kpi']) }}"

models:
  ecommerce:
    staging:
      +schema: staging
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
    kpi:
      +schema: kpi
      +materialized: view

seeds:
  ecommerce:
    +schema: reference
